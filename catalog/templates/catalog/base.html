<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Game Catalog{% endblock %}</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f3f6fb;
            color: #202b3c;
        }
        header {
            background: #172554;
            color: white;
            padding: 22px 8%;
        }
        header a {
            color: white;
            text-decoration: none;
            margin-right: 20px;
        }
        main {
            max-width: 900px;
            margin: 40px auto;
            padding: 0 20px;
        }
        .card {
            background: white;
            padding: 20px;
            margin: 16px 0;
            border-radius: 12px;
            box-shadow: 0 3px 12px #0000000d;
        }
        .button {
            display: inline-block;
            background: #2563eb;
            color: white;
            padding: 12px 18px;
            border-radius: 8px;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <header>
        <strong>Game Catalog</strong>
        <nav style="margin-top: 12px;">
            <a href="{% url 'home' %}">Головна</a>
            <a href="{% url 'game_list' %}">Каталог ігор</a>
            <a href="/admin/">Адмін-панель</a>
        </nav>
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>
</body>
</html>
